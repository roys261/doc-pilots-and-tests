<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blueprint AI Assistant User's Guide</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <header class="dell-header">
        <div class="dell-logo">
            <span class="dell-text">DELL</span>
            <span class="technologies-text">Technologies</span>
        </div>
    </header>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>Documentation</h1>
                <div class="header-controls">
                    <select id="languageSelector" class="language-selector" aria-label="Select language">
                        <option value="en">English</option>
                        <option value="es">Español</option>
                        <option value="fr">Français</option>
                        <option value="de">Deutsch</option>
                        <option value="zh">中文</option>
                        <option value="ja">日本語</option>
                    </select>
                    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
                        <span class="theme-icon">🌙</span>
                    </button>
                </div>
            </div>
            
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search documentation..." class="search-input">
            </div>
            
            <nav class="navigation" id="navigation">
                <!-- Navigation will be generated dynamically -->
            </nav>
            
            <div class="resize-handle" id="resizeHandle" aria-label="Resize sidebar"></div>
        </aside>
        
        <!-- Main Content -->
        <main class="main-content">
            <div class="content-wrapper">
                <div id="loading" class="loading hidden">
                    <div class="spinner"></div>
                    <p>Loading documentation...</p>
                </div>
                
                <div id="error" class="error hidden">
                    <h2>Error</h2>
                    <p id="errorMessage">Failed to load documentation.</p>
                </div>
                
                <article id="content" class="markdown-content">
                    <!-- Markdown content will be rendered here -->
                </article>
            </div>
        </main>
    </div>
    
    <script src="js/app.js"></script>
</body>
</html>
